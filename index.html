
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hai Bà Trưng — Hào Khí Non Sông</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.container-wrapper-genially {
    position: fixed !important;
    inset: 0;
    width: 100%;
    height: 100%;
}

.genially-embed {
    width: 100% !important;
    height: 100% !important;
}

.music-button {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 9999;
    width: 54px;
    height: 54px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    background: rgba(40,20,20,0.75);
    color: #f5dfb0;
    backdrop-filter: blur(12px);
    cursor: pointer;
    font-size: 23px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transition: transform 0.2s, background 0.2s;
}

.music-button:hover {
    transform: scale(1.1);
    background: rgba(100,35,35,0.9);
}
</style>
</head>

<body>

<audio id="bgmusic" src="music.mp3" loop></audio>

<button class="music-button" id="musicButton"
        aria-label="Play music"
        title="Play / Pause music">
    ▶
</button>

<script>
const music = document.getElementById("bgmusic");
const button = document.getElementById("musicButton");

music.volume = 0.12;

function updateButton() {
    button.textContent = music.paused ? "▶" : "♫";
    button.setAttribute(
        "aria-label",
        music.paused ? "Play music" : "Pause music"
    );
}

async function startMusic() {
    if (!music.paused) return;

    try {
        await music.play();
        updateButton();
    } catch (error) {
        console.log("Autoplay blocked:", error);
    }
}

// Try autoplay immediately
startMusic();

// First click or tap on the page attempts playback
document.addEventListener("click", startMusic, { once: true });

// Music button toggles playback
button.addEventListener("click", async (event) => {
    event.stopPropagation();

    if (music.paused) {
        await startMusic();
    } else {
        music.pause();
        updateButton();
    }
});

music.addEventListener("play", updateButton);
music.addEventListener("pause", updateButton);
</script>
